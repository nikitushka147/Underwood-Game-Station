<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underwood Game Station 🎮🍺</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #090d16;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 15px;
        }

        /* Верхня панель / Заголовок */
        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            color: #f59e0b;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }

        header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Перемикач ігор (Таби) */
        .tab-controls {
            display: flex;
            gap: 10px;
            background: #1e293b;
            padding: 6px;
            border-radius: 14px;
            border: 1px solid #334155;
            margin-bottom: 15px;
            width: 100%;
            max-width: 480px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #94a3b8;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn:hover {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        /* Контейнер для гри (Iframe) */
        .game-view {
            width: 100%;
            max-width: 480px;
            height: calc(100vh - 150px);
            max-height: 800px;
            background: #0f172a;
            border-radius: 20px;
            border: 3px solid #334155;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Прямі посилання знизу */
        footer {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
        }

        footer a {
            color: #f59e0b;
            text-decoration: none;
            margin: 0 5px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>Underwood Game Station 🎮</h1>
        <p>Обирай гру та розважайся разом із крафтом!</p>
    </header>

    <!-- Кнопки перемикання -->
    <div class="tab-controls">
        <button class="tab-btn active" onclick="switchGame('crafter', this)">
            <span>🍺</span> Beer Crafter
        </button>
        <button class="tab-btn" onclick="switchGame('fishing', this)">
            <span>🎣</span> Fishing
        </button>
    </div>

    <!-- Екран гри -->
    <div class="game-view">
        <iframe id="gameFrame" src="https://nikitushka147.github.io/Underwood-Beer-Crafter/" title="Underwood Game"></iframe>
    </div>

    <footer>
        Відкрити окремо: 
        <a href="https://nikitushka147.github.io/Underwood-Beer-Crafter/" target="_blank">Beer Crafter</a> | 
        <a href="https://nikitushka147.github.io/Underwood-Fishing/" target="_blank">Fishing</a>
    </footer>

    <script>
        const games = {
            crafter: "https://nikitushka147.github.io/Underwood-Beer-Crafter/",
            fishing: "https://nikitushka147.github.io/Underwood-Fishing/"
        };

        function switchGame(gameKey, btn) {
            const iframe = document.getElementById('gameFrame');
            
            // Зміна активної кнопки
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Перемикання джерела iframe
            if (games[gameKey]) {
                iframe.src = games[gameKey];
            }
        }
    </script>
</body>
</html>
